      <text x="462" y="119">Workflows that give time back.</text>
      <text x="895" y="119">Pipelines built for reliable insights.</text>
    </g>
    <g fill="#cbd5e1" font-size="12">
      <text x="29" y="158">POWER BI / DAX / PAGINATED REPORTS</text>
      <text x="462" y="158">POWER APPS / POWER AUTOMATE / VBA</text>
