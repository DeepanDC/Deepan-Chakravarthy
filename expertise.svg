<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="188" viewBox="0 0 1280 188" role="img" aria-labelledby="title desc">
  <title id="title">Three pillars of my work</title>
  <desc id="desc">Business intelligence: see the signal. Workflow automation: remove the repetition. Data engineering: trust the foundation.</desc>
  <defs>
    <linearGradient id="card" x2="1" y2="1">
      <stop stop-color="#152330"/>
      <stop offset="1" stop-color="#0c141e"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#67e8f9" opacity=".08"/>
    </pattern>
  </defs>
  <g fill="url(#card)" stroke="#283a49">
    <rect x="1" y="1" width="412" height="186" rx="18"/>
    <rect x="434" y="1" width="412" height="186" rx="18"/>
    <rect x="867" y="1" width="412" height="186" rx="18"/>
  </g>
  <g fill="url(#dots)">
    <rect x="1" y="1" width="412" height="186" rx="18"/>
    <rect x="434" y="1" width="412" height="186" rx="18"/>
    <rect x="867" y="1" width="412" height="186" rx="18"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g fill="#67e8f9" font-size="12" font-weight="600" letter-spacing="2">
      <text x="29" y="37">01 / ANALYTICS</text>
      <text x="462" y="37">02 / AUTOMATION</text>
      <text x="895" y="37">03 / DATA</text>
    </g>
    <g fill="#f1f5f9" font-size="25" font-weight="700">
      <text x="29" y="83">See the signal.</text>
      <text x="462" y="83">Remove the repetition.</text>
      <text x="895" y="83">Trust the foundation.</text>
    </g>
    <g fill="#94a3b8" font-size="16">
